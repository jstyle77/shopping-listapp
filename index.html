<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0071e3;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 20px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    min-width: 0;
  }
  #qty-input {
    width: 64px;
    padding: 12px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    text-align: center;
  }
  #item-input:focus, #qty-input:focus {
    border-color: var(--accent);
  }
  #add-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  #add-btn:active {
    opacity: 0.8;
  }
  .list-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  li:last-child {
    border-bottom: none;
  }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .item-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.checked .item-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 24px;
    height: 24px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .qty-value {
    min-width: 18px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }
  .delete-btn {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    flex-shrink: 0;
  }
  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding: 0 4px;
    font-size: 13px;
    color: var(--muted);
  }
  #clear-checked {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }
  #clear-checked:disabled {
    color: var(--muted);
    cursor: default;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="input-row">
      <input type="text" id="item-input" placeholder="살 것을 입력하세요" autofocus />
      <input type="number" id="qty-input" min="1" step="1" value="1" aria-label="수량" />
      <button id="add-btn">추가</button>
    </div>
    <div class="list-card">
      <ul id="item-list"></ul>
      <div class="empty-state" id="empty-state">아직 담긴 항목이 없어요</div>
    </div>
    <div class="footer">
      <span id="count-label">0개 항목</span>
      <button id="clear-checked">체크된 항목 삭제</button>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = "shopping-list-items";
  const input = document.getElementById("item-input");
  const qtyInput = document.getElementById("qty-input");
  const addBtn = document.getElementById("add-btn");
  const list = document.getElementById("item-list");
  const emptyState = document.getElementById("empty-state");
  const countLabel = document.getElementById("count-label");
  const clearCheckedBtn = document.getElementById("clear-checked");

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) {}
  }

  let items = loadItems();

  function render() {
    list.innerHTML = "";
    emptyState.style.display = items.length === 0 ? "block" : "none";

    items.forEach((item) => {
      const li = document.createElement("li");
      li.className = item.checked ? "checked" : "";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = item.checked;
      checkbox.addEventListener("change", () => {
        item.checked = checkbox.checked;
        saveItems(items);
        render();
      });

      const text = document.createElement("span");
      text.className = "item-text";
      text.textContent = item.text;

      const qtyControl = document.createElement("div");
      qtyControl.className = "qty-control";

      const minusBtn = document.createElement("button");
      minusBtn.className = "qty-btn";
      minusBtn.textContent = "−";
      minusBtn.setAttribute("aria-label", "수량 감소");
      minusBtn.addEventListener("click", () => {
        item.qty = Math.max(1, (item.qty || 1) - 1);
        saveItems(items);
        render();
      });

      const qtyValue = document.createElement("span");
      qtyValue.className = "qty-value";
      qtyValue.textContent = item.qty || 1;

      const plusBtn = document.createElement("button");
      plusBtn.className = "qty-btn";
      plusBtn.textContent = "+";
      plusBtn.setAttribute("aria-label", "수량 증가");
      plusBtn.addEventListener("click", () => {
        item.qty = (item.qty || 1) + 1;
        saveItems(items);
        render();
      });

      qtyControl.appendChild(minusBtn);
      qtyControl.appendChild(qtyValue);
      qtyControl.appendChild(plusBtn);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "✕";
      deleteBtn.setAttribute("aria-label", "삭제");
      deleteBtn.addEventListener("click", () => {
        items = items.filter((i) => i.id !== item.id);
        saveItems(items);
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(qtyControl);
      li.appendChild(deleteBtn);
      list.appendChild(li);
    });

    countLabel.textContent = items.length + "개 항목";
    clearCheckedBtn.disabled = !items.some((i) => i.checked);
  }

  function addItem() {
    const value = input.value.trim();
    if (!value) return;
    const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
    items.push({ id: Date.now() + Math.random(), text: value, qty: qty, checked: false });
    saveItems(items);
    input.value = "";
    qtyInput.value = "1";
    render();
    input.focus();
  }

  addBtn.addEventListener("click", addItem);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });
  qtyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });
  clearCheckedBtn.addEventListener("click", () => {
    items = items.filter((i) => !i.checked);
    saveItems(items);
    render();
  });

  render();
})();
</script>
</body>
</html>
